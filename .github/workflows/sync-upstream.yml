name: Sync Upstream

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    name: 创建 upstream 同步 PR
    runs-on: ubuntu-latest

    steps:
      - name: 检出 fork main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: 合并 upstream main
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/jlcodes99/cockpit-tools.git
          git fetch origin main
          git fetch upstream main

          branch="automation/sync-upstream-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          git checkout -B "$branch" origin/main
          git merge --no-edit upstream/main

          if git diff --quiet origin/main...HEAD; then
            echo "没有需要同步的 upstream 变更。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: 创建同步 PR
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          title="同步 upstream main $(date -u +%Y-%m-%d)"
          body="$(cat <<'EOF'
## 摘要
- 合并 jlcodes99/cockpit-tools 的 upstream main 到当前 fork。
- 不自动合并、不自动发布，需人工确认后再进入 sidecar 发布流程。

## 验证建议
- 检查冲突解决结果和 Claude → Codex 转换补丁是否仍然存在。
- 合并后手动触发 Sidecar Release，或创建 sidecar-v* tag 发布 Windows sidecar。
EOF
)"
          gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
